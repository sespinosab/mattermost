name: Deploy Monitoring Stack

on:
  pull_request:
    branches:
      - master
    paths:
      - "observability/**"
      - ".github/workflows/deploy-monitoring.yml"

  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest

    # Para PR: solo permitir feat/add-monitoring-stack -> master
    # Para ejecución manual: permitir ejecución desde master
    if: |
      (github.event_name == 'pull_request' &&
       github.head_ref == 'feat/add-monitoring-stack' &&
       github.base_ref == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master')

    environment: mattermost-ec2-production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::506305355048:role/MattermostGitHubDeploy
          aws-region: us-east-1

      - name: Deploy monitoring stack in EC2
        env:
          INSTANCE_ID: i-0931fe9de23859d52
        run: |
          set -euo pipefail

          aws ssm describe-instance-information \
          --region us-east-1 \
          --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
          --output json

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=mattermost-server" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/mattermost",
              "git pull origin master",
              "sudo docker-compose -f observability/docker-compose.monitoring.yml --env-file .env up -d"
            ]' \
            --comment "Deploy Mattermost monitoring stack" \
            --query "Command.CommandId" \
            --output text)

            echo "SSM Command ID: $COMMAND_ID"

            echo "Checking SSM command details..."

            aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --region us-east-1 \
              --output json

            echo "Waiting for SSM command to start..."

            STATUS=""

            for i in {1..30}; do
            set +e

            RESPONSE=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region us-east-1 \
              --output json 2>&1)

            EXIT_CODE=$?

            set -e

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "Attempt $i - Invocation not available yet:"
              echo "$RESPONSE"
              sleep 5
              continue
            fi

            STATUS=$(echo "$RESPONSE" | jq -r '.Status')

            echo "Attempt $i - Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Monitoring stack deployed successfully."
                echo "$RESPONSE"
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command failed with status: $STATUS"
                echo "$RESPONSE"
                exit 1
                ;;
            esac

            sleep 5

            done

            echo "Timed out waiting for the SSM command."

            echo "Final command invocation list:"
            aws ssm list-command-invocations 
            --command-id "$COMMAND_ID" 
            --details 
            --region us-east-1 
            --output json || true

            exit 1