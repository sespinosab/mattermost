name: Deploy Monitoring Stack

on:
  pull_request:
    branches:
      - master
    paths:
      - "observability/**"
      - ".github/workflows/deploy-monitoring.yml"

  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest

    # Para PR: solo permitir feat/add-monitoring-stack -> master
    # Para ejecución manual: permitir ejecución desde master
    if: |
      (github.event_name == 'pull_request' &&
       github.head_ref == 'feat/add-monitoring-stack' &&
       github.base_ref == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master')

    environment: mattermost-ec2-production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::506305355048:role/MattermostGitHubDeploy
          aws-region: us-east-1

      - name: Deploy monitoring stack in EC2
        env:
          INSTANCE_ID: i-0931fe9de23859d52
        run: |
          set -euo pipefail

          aws ssm describe-instance-information \
          --region us-east-1 \
          --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
          --output json

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=mattermost-server" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/mattermost",
              "git pull origin master",
              "docker compose -f observability/docker-compose.monitoring.yml --env-file .env up -d"
            ]' \
            --comment "Deploy Mattermost monitoring stack" \
            --query "Command.CommandId" \
            --output text)

            echo "SSM Command ID: $COMMAND_ID"

            echo "Waiting for SSM command to start..."

            for i in {1..30}; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "Status" \
                --output text 2>/dev/null || true)

              echo "Attempt $i - Status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                echo "Monitoring stack deployed successfully."
                break
              fi

              if [ "$STATUS" = "Failed" ] || \
                [ "$STATUS" = "Cancelled" ] || \
                [ "$STATUS" = "TimedOut" ]; then

                echo "SSM command failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --output json

                exit 1
              fi

              sleep 5
            done

            if [ "$STATUS" != "Success" ]; then
              echo "Timed out waiting for the SSM command."
              exit 1
            fi

            echo "Getting command output..."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --output json