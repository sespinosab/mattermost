services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mattermost-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mattermost_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: mattermost-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - mattermost_network

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: mattermost-node-exporter
    restart: unless-stopped
    pid: "host"
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - mattermost_network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: mattermost-blackbox
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - mattermost_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mattermost-postgres-exporter
    restart: unless-stopped
    environment:
      #- DATA_SOURCE_NAME=postgres://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?sslmode=disable&connect_timeout=10
      - DATA_SOURCE_NAME=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&connect_timeout=10
    ports:
      - "9187:9187"
    networks:
      - mattermost_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mattermost-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    networks:
      - mattermost_network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: mattermost-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - mattermost_network

  loki:
    image: grafana/loki:2.9.8
    container_name: mattermost-loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - mattermost_network

  promtail:
    image: grafana/promtail:2.9.8
    container_name: mattermost-promtail
    restart: unless-stopped
    command: [ "-config.file=/etc/promtail/promtail-config.yml" ]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - mattermost_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: mattermost-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki
    networks:
      - mattermost_network

  trace-synthesizer:
    image: python:3.11-alpine
    container_name: mattermost-trace-synthesizer
    restart: unless-stopped
    environment:
      - TEMPO_ENDPOINT=http://mattermost-tempo:4318/v1/traces
      - LOKI_ENDPOINT=http://mattermost-loki:3100/loki/api/v1/push
    volumes:
      - ./scripts/log_trace_synthesizer.py:/app/synthesizer.py:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: [ "python", "-u", "/app/synthesizer.py" ]
    depends_on:
      - tempo
      - loki
    networks:
      - mattermost_network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local

networks:
  mattermost_network:
    external: true
    name: mattermost_mattermost_network
