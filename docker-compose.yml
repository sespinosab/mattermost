services:
  mattermost:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: ${MATTERMOST_IMAGE}
    container_name: mattermost-app
    restart: unless-stopped
    #depends_on:
    #  postgres:
    #    condition: service_healthy
    ports:
      - "8065:8065"
      - "8067:8067"
    environment:
      # Database connection configuration
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&connect_timeout=10
      # Metrics and Observability (Prometheus)
      - MM_METRICSSETTINGS_ENABLE=true
      - MM_METRICSSETTINGS_LISTENADDRESS=:8067
      # Service operational settings
      - MM_SERVICESETTINGS_SITEURL=${MM_SITE_URL}
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
      # File storage configuration
      - MM_FILESETTINGS_DRIVERNAME=local
      - MM_FILESETTINGS_DIRECTORY=/mattermost/data
      # OpenTelemetry & Tracing (OTel Exporter & Context Propagation)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://mattermost-otel-collector:4318
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=mattermost-app
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PROPAGATORS=tracecontext,baggage
      # Logging estructurado JSON con Trace ID
      - MM_LOGSETTINGS_ENABLECONSOLE=true
      - MM_LOGSETTINGS_CONSOLEJSON=true
      - MM_LOGSETTINGS_ENABLECOLOR=false
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    networks:
      - mattermost_network

